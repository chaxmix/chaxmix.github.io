<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Design system cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css?v=pc16">
<link rel="stylesheet" href="covers/ds-motion.css?v=pc16">
<style>
  body { padding: 24px; }
  .pc { display: grid; grid-template-columns: minmax(0, 552px) minmax(0, 1fr); gap: 32px; align-items: start; max-width: 1500px; margin: 0 auto; }
  .pc figcaption { padding: 12px 4px 0; font-size: 14px; color: var(--muted); }
  figure { margin: 0; }
  .big .cover { height: 600px; }
  .big .cover > .cam:not(.blob):not(.badge) { scale: 1.66; }
  @media (max-width: 1000px) { .pc { grid-template-columns: 1fr; } }
</style></head>
<body>
<div class="pc">
  <figure>
    <a class="card" href="#" onclick="return false">
      <div class="cover dsm dark" data-ds-motion><canvas class="shader-bg" data-colors="#070b10,#0f2c3d,#1f8aca,#77bbe4" aria-hidden="true"></canvas></div>
      <div class="card-meta"><div><h3>Building RealInsight's design system</h3><p>Card size, as it would sit on the home page. Colors are RealInsight tokens; hover to stir the gradient.</p></div></div>
    </a>
  </figure>
  <figure class="big"><a class="card" href="#" onclick="return false"><div class="cover dsm dark" data-ds-motion><canvas class="shader-bg" data-colors="#070b10,#0f2c3d,#1f8aca,#77bbe4" aria-hidden="true"></canvas></div></a><figcaption>Large, so you can see the detail.</figcaption></figure>
</div>
<script src="covers/shader-bg.js?v=pc16"></script>
<script src="covers/ds-motion.js?v=pc16"></script>
</body></html>
