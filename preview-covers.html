<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Design system cover ideas</title>
<link rel="stylesheet" href="styles.css?v=pc1">
<style>
  body { padding: 24px; }
  .pc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 32px 24px; max-width: 1800px; margin: 0 auto; }
  .pc-grid figcaption { padding: 12px 4px 0; font-size: 15px; } .pc-grid figcaption b { font-weight: 600; } .pc-grid figcaption span { color: var(--muted); display: block; font-size: 13px; }
  figure { margin: 0; }
  .cover { height: 360px; }

  /* ---------- A · Tokens become components ---------- */
  .ca { --ink:#1d1d1f; --acc:#3b5bff; }
  .ca .stage { position: relative; width: 420px; height: 250px; }
  .ca .tok { position: absolute; display: grid; place-items: center; border-radius: 10px; font: 600 13px/1 var(--mono, monospace); box-shadow: 0 8px 20px rgba(40,60,160,.12); }
  .ca .sw { width: 44px; height: 44px; }
  .ca .sw1 { left: 0; top: 0; background: var(--acc); animation: caSw1 7s cubic-bezier(.6,0,.2,1) infinite; }
  .ca .sw2 { left: 0; top: 56px; background: #fff; animation: caSw2 7s cubic-bezier(.6,0,.2,1) infinite; }
  .ca .sw3 { left: 0; top: 112px; background: var(--ink); animation: caSw3 7s cubic-bezier(.6,0,.2,1) infinite; }
  .ca .type { left: 0; top: 168px; width: 44px; height: 44px; background: #fff; color: var(--ink); font: 500 18px/1 inherit; font-family: inherit; animation: caTy 7s cubic-bezier(.6,0,.2,1) infinite; }
  .ca .lbl { position: absolute; left: 56px; font: 500 11px/44px var(--mono, monospace); color: #5a6280; animation: caLbl 7s ease infinite; }
  .ca .comp { position: absolute; right: 0; top: 20px; width: 250px; padding: 18px; border-radius: 16px; background: #fff; box-shadow: 0 30px 60px rgba(40,60,160,.18); display: grid; gap: 12px; animation: caComp 7s cubic-bezier(.3,1.4,.5,1) infinite; transform-origin: 50% 60%; }
  .ca .comp h4 { font-size: 15px; font-weight: 600; } .ca .comp p { font-size: 12px; color: #6b7287; line-height: 1.4; }
  .ca .row { display: flex; align-items: center; justify-content: space-between; }
  .ca .btn { height: 32px; padding: 0 14px; border-radius: 999px; background: var(--acc); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; animation: caBtn 7s ease infinite; }
  .ca .tgl { width: 36px; height: 20px; border-radius: 99px; background: #d7dcef; position: relative; animation: caTglBg 7s ease infinite; }
  .ca .tgl::after { content:""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); animation: caTgl 7s cubic-bezier(.3,1.5,.5,1) infinite; }
  @keyframes caSw1 { 0%,8% { transform: none } 22%,78% { transform: translate(296px, 168px) scale(.0); opacity: 0 } 92%,100% { transform: none; opacity: 1 } }
  @keyframes caSw2 { 0%,12% { transform: none } 26%,78% { transform: translate(200px, -30px) scale(0); opacity: 0 } 92%,100% { transform: none; opacity: 1 } }
  @keyframes caSw3 { 0%,16% { transform: none } 30%,78% { transform: translate(220px, -60px) scale(0); opacity: 0 } 92%,100% { transform: none; opacity: 1 } }
  @keyframes caTy { 0%,20% { transform: none } 34%,78% { transform: translate(200px, -130px) scale(0); opacity: 0 } 92%,100% { transform: none; opacity: 1 } }
  @keyframes caLbl { 0%,8% { opacity: 1 } 18%,82% { opacity: 0 } 94%,100% { opacity: 1 } }
  @keyframes caComp { 0%,18% { transform: scale(.6); opacity: 0 } 34%,80% { transform: none; opacity: 1 } 90%,100% { transform: scale(.6); opacity: 0 } }
  @keyframes caBtn { 0%,48% { filter: none } 52% { filter: brightness(1.15); transform: scale(.95) } 56%,100% { filter: none; transform: none } }
  @keyframes caTglBg { 0%,56% { background: #d7dcef } 60%,100% { background: var(--acc) } }
  @keyframes caTgl { 0%,56% { transform: none } 62%,100% { transform: translateX(16px) } }

  /* ---------- B · Exploded layers ---------- */
  .cb { perspective: 1200px; }
  .cb .stack { position: relative; width: 260px; height: 170px; transform: rotateX(58deg) rotateZ(-38deg); transform-style: preserve-3d; margin-top: 40px; }
  .cb .layer { position: absolute; inset: 0; border-radius: 18px; transform-style: preserve-3d; box-shadow: 0 0 0 1px rgba(255,255,255,.18) inset; }
  .cb .l1 { background: rgba(255,255,255,.06); animation: cbL1 6s cubic-bezier(.5,0,.2,1) infinite; display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; padding: 18px; }
  .cb .l1 i { border-radius: 6px; background: var(--s); }
  .cb .l2 { background: rgba(255,255,255,.1); animation: cbL2 6s cubic-bezier(.5,0,.2,1) infinite; padding: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
  .cb .l2 b { height: 26px; border-radius: 99px; background: #f2542d; } .cb .l2 b:nth-child(2) { background: rgba(255,255,255,.85); } .cb .l2 b:nth-child(3) { grid-column: span 2; height: 30px; border-radius: 8px; background: rgba(255,255,255,.25); } .cb .l2 b:nth-child(4) { width: 44px; height: 24px; background: #8ea2ff; }
  .cb .l3 { background: #fff; animation: cbL3 6s cubic-bezier(.5,0,.2,1) infinite; padding: 16px; display: grid; gap: 8px; align-content: start; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .cb .l3 span { height: 8px; border-radius: 4px; background: #e6e8f0; } .cb .l3 span:first-child { width: 50%; height: 10px; background: #1d1d1f; } .cb .l3 em { height: 26px; width: 40%; border-radius: 99px; background: #f2542d; margin-top: 6px; }
  .cb .tag { position: absolute; font: 500 11px/1 var(--mono, monospace); color: rgba(255,255,255,.7); left: calc(50% + 150px); white-space: nowrap; animation: cbTag 6s ease infinite; }
  .cb .t1 { top: 62%; } .cb .t2 { top: 47%; } .cb .t3 { top: 32%; }
  @keyframes cbL1 { 0%,10%,90%,100% { transform: translateZ(0) } 35%,70% { transform: translateZ(-50px) } }
  @keyframes cbL2 { 0%,10%,90%,100% { transform: translateZ(0); opacity: 0 } 35%,70% { transform: translateZ(10px); opacity: 1 } }
  @keyframes cbL3 { 0%,10%,90%,100% { transform: translateZ(2px) } 35%,70% { transform: translateZ(70px) } }
  @keyframes cbTag { 0%,25%,80%,100% { opacity: 0 } 40%,70% { opacity: 1 } }

  /* ---------- C · Living sticker sheet ---------- */
  .cc .sheet { display: grid; grid-template-columns: repeat(3, auto); gap: 16px; align-items: center; justify-items: center; padding: 22px 26px; border-radius: 20px; background: rgba(255,255,255,.7); box-shadow: 0 30px 60px rgba(30,40,80,.12); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .cc .b { height: 34px; padding: 0 16px; border-radius: 99px; background: #1d1d1f; color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; animation: ccPress 4s ease infinite; }
  .cc .b.sec { background: #fff; color: #1d1d1f; box-shadow: 0 0 0 1px #dfe2ea inset; animation-delay: 1.2s; }
  .cc .tg { width: 40px; height: 22px; border-radius: 99px; position: relative; background: #d9dce6; animation: ccTgBg 4s ease .6s infinite backwards; }
  .cc .tg::after { content:""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); animation: ccTg 4s cubic-bezier(.3,1.6,.5,1) infinite; animation-delay: .6s; }
  .cc .cb2 { width: 22px; height: 22px; border-radius: 7px; background: #fff; box-shadow: 0 0 0 1.5px #cfd3de inset; display: grid; place-items: center; animation: ccCk 4s ease infinite; animation-delay: 1.8s; }
  .cc .cb2 svg { animation: ccCkM 4s ease infinite; animation-delay: 1.8s; }
  .cc .in { width: 150px; height: 34px; border-radius: 10px; background: #fff; box-shadow: 0 0 0 1px #dfe2ea inset; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: #8a90a2; animation: ccFocus 4s ease infinite; animation-delay: 2.4s; grid-column: span 2; }
  .cc .in::after { content: ""; width: 1px; height: 14px; background: #1d1d1f; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  .cc .chip { height: 26px; padding: 0 10px; border-radius: 99px; background: #ffe9e2; color: #c73a17; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
  .cc .sl { width: 120px; height: 4px; border-radius: 4px; background: #e2e5ee; position: relative; }
  .cc .sl::before { content:""; position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; background: #f2542d; animation: ccSl 4s ease-in-out infinite alternate; }
  .cc .sl i { position: absolute; top: -7px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); animation: ccSlK 4s ease-in-out infinite alternate; }
  .cc .av { display: flex; } .cc .av span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; margin-left: -8px; background: var(--a); } .cc .av span:first-child { margin-left: 0; }
  @keyframes ccPress { 0%,20%,32%,100% { transform: none; filter: none } 25% { transform: scale(.94); filter: brightness(1.3) } }
  @keyframes ccTgBg { 0%,30% { background: #d9dce6 } 36%,80% { background: #f2542d } 86%,100% { background: #d9dce6 } }
  @keyframes ccTg { 0%,30% { transform: none } 38%,80% { transform: translateX(18px) } 88%,100% { transform: none } }
  @keyframes ccCk { 0%,30% { background: #fff; box-shadow: 0 0 0 1.5px #cfd3de inset } 36%,80% { background: #1d1d1f; box-shadow: none } 86%,100% { background: #fff; box-shadow: 0 0 0 1.5px #cfd3de inset } }
  @keyframes ccCkM { 0%,32% { opacity: 0; transform: scale(.4) } 40%,80% { opacity: 1; transform: none } 86%,100% { opacity: 0 } }
  @keyframes ccFocus { 0%,30%,85%,100% { box-shadow: 0 0 0 1px #dfe2ea inset } 38%,78% { box-shadow: 0 0 0 1.5px #f2542d inset, 0 0 0 4px #ffe1d8 } }
  @keyframes ccSl { from { width: 20% } to { width: 75% } }
  @keyframes ccSlK { from { left: calc(20% - 9px) } to { left: calc(75% - 9px) } }
  @keyframes blink { 50% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .pc-grid * { animation: none !important; } }
</style></head>
<body>
<div class="pc-grid">
  <figure>
    <div class="cover ca" style="--c-bg:#e6e9ff; --c-1:#a9b4ff; --c-2:#d4f1ff">
      <span class="blob one"></span><span class="blob two"></span>
      <div class="stage" aria-hidden="true">
        <span class="tok sw sw1"></span><span class="lbl" style="top:0">color.primary</span>
        <span class="tok sw sw2"></span><span class="lbl" style="top:56px">color.surface</span>
        <span class="tok sw sw3"></span><span class="lbl" style="top:112px">color.ink</span>
        <span class="tok type">Aa</span><span class="lbl" style="top:168px">type.body</span>
        <div class="comp"><h4>Monthly report</h4><p>Tokens snap together into a real component.</p><div class="row"><span class="btn">Share</span><span class="tgl"></span></div></div>
      </div>
    </div>
    <figcaption><b>A · Tokens become components</b><span>Color and type tokens fly into place and assemble a card, then the card comes alive (button press, toggle). Tells the "foundations to product" story.</span></figcaption>
  </figure>
  <figure>
    <div class="cover cb dark" style="--c-bg:#15161b; --c-1:#3b47b8; --c-2:#15161b">
      <span class="blob one" style="opacity:.8; filter: blur(70px)"></span>
      <div class="stack" aria-hidden="true">
        <div class="layer l1"><i style="--s:#f2542d"></i><i style="--s:#ff9a7a"></i><i style="--s:#ffe1d8"></i><i style="--s:#8ea2ff"></i><i style="--s:#c9d2ff"></i><i style="--s:#fff"></i><i style="--s:#2a2c35"></i><i style="--s:#4a4d5a"></i><i style="--s:#8a8fa0"></i><i style="--s:#c4c7d2"></i><i style="--s:#e6e8f0"></i><i style="--s:#f7f8fb"></i></div>
        <div class="layer l2"><b></b><b></b><b></b><b></b></div>
        <div class="layer l3"><span></span><span></span><span style="width:80%"></span><em></em></div>
      </div>
      <span class="tag t3" aria-hidden="true">Product</span><span class="tag t2" aria-hidden="true">Components</span><span class="tag t1" aria-hidden="true">Tokens</span>
    </div>
    <figcaption><b>B · Exploded layers</b><span>A product screen lifts apart into its layers (tokens, components, product) and settles back. Dark and premium, and it reads as systems thinking at a glance.</span></figcaption>
  </figure>
  <figure>
    <div class="cover cc" style="--c-bg:#f3f1ee; --c-1:#ffd9cc; --c-2:#e6ecff">
      <span class="blob one"></span><span class="blob two"></span>
      <div class="sheet" aria-hidden="true">
        <span class="b">Primary</span><span class="b sec">Secondary</span><span class="tg"></span>
        <span class="in">Search components</span><span class="cb2"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <span class="chip">New</span><span class="sl"><i></i></span><span class="av"><span style="--a:#f2542d"></span><span style="--a:#8ea2ff"></span><span style="--a:#ffd166"></span></span>
      </div>
    </div>
    <figcaption><b>C · Living sticker sheet</b><span>A glass panel of real components cycling through their states (press, toggle, check, focus, drag). The most literal; shows breadth and interaction craft.</span></figcaption>
  </figure>
</div>
</body></html>
